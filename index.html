<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="../src/assets/images/logo/logo-.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meditrack</title>
  <!-- Main CSS -->
  <link rel="stylesheet" href="../src/style.css" />
  <!-- Main JS Script -->
  <script type="module" src="../src/main.js" defer></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Inter -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">
</head>

<body>
  <header class="primary-header">
    <div class="container">
      <div class="primary-header-content-wrapper">
        <a href="#" class="logo-link">
          <svg class="logo">
            <use xlink:href="../src/assets/images/logo/logo.svg#logo"></use>
          </svg>
          <div class="logo-content">
            <p class="fw-bold secondary-heading"><span>Medi</span><span class="text-accent-400">Track</span></p>
            <p class="logo-small-text capitalize">patient records management </p>
          </div>
        </a>
        <select id="themeSwitcher" class="theme-switcher" aria-label="Theme Switcher">
          <option value="" data-theme="system">System</option>
          <option value="" data-theme="light">Light</option>
          <option value="" data-theme="dark">Dark</option>
        </select>
      </div>
    </div>
  </header>
  <main>
    <section class="add-patient-form">
      <div class="contaner">
        <h2 class="add-patient-form-heading | fw-semi-bold secondary-heading  capitalize">add patient</h2>
      </div>
      <form action="">
        <!-- full name -->
        <div class="add-patient-form-input-wrapper">
          <label class="capitalize fw-semi-bold" for="full-name"> full name:</label>
          <input type="text" name="full-name" id="fullName" placeholder="john doe" required>
        </div>
                <!-- age-->
        <div class="add-patient-form-input-wrapper">
          <label class="capitalize fw-semi-bold" for="age"> age:</label>
          <input type="number" name="age" id="age" placeholder="23" required>
        </div>
        <!-- gender -->
        <div class="add-patient-form-input-wrapper">
          <label class="capitalize fw-semi-bold" for="gender"> gender:</label>
          <select name="gender" id="gender" required>
            <option value="male">Male</option>
            <option value="female">Female</option>
          </select>
        </div>
        <!-- email -->
        <div class="add-patient-form-input-wrapper">
          <label class="capitalize fw-semi-bold" for="email"> email:</label>
          <input type="email" name="email" id="email" placeholder="john.doe@example.com" required>
        </div>
        <!-- phone -->
        <div class="add-patient-form-input-wrapper">
          <label class="capitalize fw-semi-bold" for="phone"> phone:</label>
          <input type="tel" name="phone" id="phone" placeholder="(123) 456-7890" required>
        </div>
        <!-- Condition -->
        <div class="add-patient-form-input-wrapper">
          <label class="capitalize fw-semi-bold" for="condition"> condition:</label>
          <input type="text" name="condition" id="condition" placeholder="e.g., Diabetes" required>
        </div>
        <!-- last visit -->
        <div class="add-patient-form-input-wrapper">
          <label class="capitalize fw-semi-bold" for="last-visit"> last visit:</label>
          <input type="date" name="last-visit" id="lastVisit" required>
        </div>
        <!-- status  -->
        <div class="add-patient-form-input-wrapper">
          <label class="capitalize fw-semi-bold" for="status"> status:</label>
          <select name="status" id="status" required>
            <option value="active">Active</option>
            <option value="inactive">Recovered</option>
            <option value="inactive">Critical</option>
            <option value="inactive">Deceased</option>
          </select>
        </div>
        <!-- textarea -->
        <div class="add-patient-form-input-wrapper">
          <label class="capitalize fw-semi-bold" for="notes"> notes:</label>
          <textarea name="notes" id="notes" placeholder="Enter any additional notes about the patient..."></textarea>
        </div>
      </form>
    </section>
  </main>
  <footer class="primary-footer">
    <div class="container">
      <div class="primary-footer-wrapper">
        <div class="primary-footer-logo-copyright-wrapper">
          <svg class="logo">
            <use xlink:href="../src/assets/images/logo/logo.svg#logo"></use>
          </svg>
          <p class="primary-footer-copyright-text">&copy; 2026 MediTrack. All rights reserved.</p>
        </div>
        <nav class="primary-footer-social-nav" aria-label="social links">
          <ul class="primary-footer-social-nav-links-list">
            <!-- github -->
            <li><a href="#">
                <svg class="primary-footer-social-icon">
                  <use xlink:href="../src/assets/images/social-icons/social.svg#github"></use>
                </svg>
              </a></li>
            <!-- facebook -->
            <li><a href="#">
                <svg class="primary-footer-social-icon">
                  <use xlink:href="../src/assets/images/social-icons/social.svg#facebook"></use>
                </svg>
              </a></li>
            <!-- instagram -->
            <li><a href="#">
                <svg class="primary-footer-social-icon">
                  <use xlink:href="../src/assets/images/social-icons/social.svg#instagram"></use>
                </svg>
              </a></li>
            <!-- linkedin -->
            <li><a href="#">
                <svg class="primary-footer-social-icon">
                  <use xlink:href="../src/assets/images/social-icons/social.svg#linkedin"></use>
                </svg>
              </a></li>
            <!-- twitter -->
            <li><a href="#">
                <svg class="primary-footer-social-icon">
                  <use xlink:href="../src/assets/images/social-icons/social.svg#twitter"></use>
                </svg>
              </a></li>
            <!-- youtube -->
            <li><a href="#">
                <svg class="primary-footer-social-icon">
                  <use xlink:href="../src/assets/images/social-icons/social.svg#youtube"></use>
                </svg>
              </a></li>
          </ul>
        </nav>
      </div>
    </div>
  </footer>
</body>

</html>
